# Shared query set for the DuckDB vs Unity Catalog Serverless SQL
# benchmark. Every table is synthetic. Columns are col_0..col_N
# with types cycling BIGINT / DOUBLE / VARCHAR / BOOLEAN / TIMESTAMP.
# SQL is DuckDB-style (CAST(... AS TEXT)); the Databricks runner
# rewrites TEXT -> STRING (benchmark/dialect.py).

- id: ds1_select_ordered_limit30
  table: ds1
  description: "20-col / 4,424,286-row table: full CAST projection, ORDER BY, LIMIT 30"
  sql: >
    SELECT CAST(col_0 AS BIGINT) AS col_0, CAST(col_1 AS DOUBLE) AS col_1, CAST(col_2 AS TEXT) AS col_2, CAST(col_3 AS BOOLEAN) AS col_3, CAST(col_4 AS DATE) AS col_4, CAST(col_5 AS BIGINT) AS col_5, CAST(col_6 AS DOUBLE) AS col_6, CAST(col_7 AS TEXT) AS col_7, CAST(col_8 AS BOOLEAN) AS col_8, CAST(col_9 AS DATE) AS col_9, CAST(col_10 AS BIGINT) AS col_10, CAST(col_11 AS DOUBLE) AS col_11, CAST(col_12 AS TEXT) AS col_12, CAST(col_13 AS BOOLEAN) AS col_13, CAST(col_14 AS DATE) AS col_14, CAST(col_15 AS BIGINT) AS col_15, CAST(col_16 AS DOUBLE) AS col_16, CAST(col_17 AS TEXT) AS col_17, CAST(col_18 AS BOOLEAN) AS col_18, CAST(col_19 AS DATE) AS col_19
    FROM {ds1_table}
    ORDER BY col_0 ASC, col_1 ASC, col_2 ASC, col_3 ASC, col_4 ASC, col_5 ASC, col_6 ASC, col_7 ASC, col_8 ASC, col_9 ASC, col_10 ASC, col_11 ASC, col_12 ASC, col_13 ASC, col_14 ASC, col_15 ASC, col_16 ASC, col_17 ASC, col_18 ASC, col_19 ASC
    LIMIT 30 OFFSET 0

