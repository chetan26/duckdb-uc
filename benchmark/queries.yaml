- id: ds10_sum_aggregate
  table: ds10
  description: "1000-col synthetic table: SUM over 5 DOUBLE columns"
  sql: >
    SELECT SUM(CAST(col_1 AS DOUBLE)) AS col_1, SUM(CAST(col_6 AS DOUBLE)) AS col_6, SUM(CAST(col_11 AS DOUBLE)) AS col_11, SUM(CAST(col_16 AS DOUBLE)) AS col_16, SUM(CAST(col_21 AS DOUBLE)) AS col_21
    FROM {ds10_table}
    ORDER BY col_1 ASC, col_6 ASC, col_11 ASC, col_16 ASC, col_21 ASC
    LIMIT 1000 OFFSET 0

